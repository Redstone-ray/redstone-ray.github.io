<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520" width="1800" height="520" shape-rendering="geometricPrecision" role="img" aria-labelledby="t d">
<title id="t">Mix to quench, for scale</title>
<desc id="d">A linear time axis from 0 to 300 milliseconds. The plunger’s whole job, from MIX at t = 0 to QUENCH, is a sliver under 10 ms at the far left. Further along: a blink, about 100–150 ms, and you pressing a button, about 250 ms; by then the crystal is long frozen.</desc>
