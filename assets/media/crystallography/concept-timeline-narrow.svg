<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" width="800" height="1400" shape-rendering="geometricPrecision" role="img" aria-labelledby="t d">
<title id="t">Mix to quench, for scale</title>
<desc id="d">A vertical time axis from 0 to 300 milliseconds. The plunger’s whole job, from MIX at t = 0 to QUENCH, is a sliver under 10 ms at the very top. Further down: a blink, about 100–150 ms, and you pressing a button, about 250 ms; by then the crystal is long frozen.</desc>
<defs><linearGradient id="amb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcf6a"/><stop offset="1" stop-color="#e8962c"/></linearGradient><linearGradient id="pl" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="188"><stop offset="0" stop-color="#e8962c"/><stop offset=".5" stop-color="#ffcf6a"/><stop offset="1" stop-color="#8f86e8"/></linearGradient><linearGradient id="frz" gradientUnits="userSpaceOnUse" x1="0" y1="188" x2="0" y2="1290"><stop offset="0" stop-color="#8f86e8" stop-opacity=".9"/><stop offset="1" stop-color="#8f86e8" stop-opacity=".25"/></linearGradient><pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#121212" stroke-width="1" stroke-opacity=".14"/></pattern><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L10.5 6L1.5 10.5" fill="none" stroke="#121212" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
