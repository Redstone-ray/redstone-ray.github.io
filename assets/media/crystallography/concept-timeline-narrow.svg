<circle cx="250" cy="1100" r="3.2" fill="#121212"/>
<text x="400" y="1032" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="30" letter-spacing=".06em" fill="#4b4b4b">YOU, PRESSING</text>
<text x="400" y="1070" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="30" letter-spacing=".06em" fill="#4b4b4b">A BUTTON</text>
<text x="400" y="1128" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="46" letter-spacing=".03em" fill="#121212">≈ 250 ms</text>
<text x="400" y="1176" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="26" letter-spacing=".06em" fill="#8a8a8a">BY THEN,</text>
<text x="400" y="1210" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="26" letter-spacing=".06em" fill="#8a8a8a">LONG FROZEN.</text>
